<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radio">
<meta name="theme-color" content="#1e2129">
<title>Radio</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%2314161c'/%3E%3Ccircle cx='90' cy='90' r='52' fill='%23ffd23f'/%3E%3Cpath d='M76 66v48l40-24z' fill='%2314161c'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#14161c; --panel:#1e2129; --panel2:#262a34; --fg:#f4f2ea; --muted:#9aa0ad;
    --accent:#ffd23f; --accent-fg:#14161c; --live:#ff4d4d;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button{font:inherit;cursor:pointer}
  button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}

  /* Barra "in ascolto" */
  .now{
    position:sticky;top:0;z-index:2;
    display:flex;align-items:center;gap:22px;
    padding:calc(18px + env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) 18px max(24px,env(safe-area-inset-left));
    background:var(--panel);border-bottom:1px solid #2c303a;
  }
  #play{
    flex:none;width:112px;height:112px;border-radius:50%;border:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    background:var(--accent);color:var(--accent-fg);
    box-shadow:0 8px 30px rgba(255,210,63,.25);
    transition:transform .1s,background .2s,color .2s,box-shadow .2s;
  }
  #play:active{transform:scale(.96)}
  #play svg{width:34px;height:34px}
  #play .lbl{font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
  .playing #play{background:var(--panel2);color:var(--accent);box-shadow:inset 0 0 0 4px var(--accent)}
  .info{flex:1;min-width:0}
  .status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px;min-height:20px}
  .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--muted)}
  .playing .dot{background:var(--live);animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.3}}
  @media (prefers-reduced-motion:reduce){.playing .dot{animation:none}}
  #name{margin:4px 0 0;font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vol{display:flex;align-items:center;gap:12px;flex:0 1 380px}
  .vol button{flex:none;width:56px;height:56px;border-radius:16px;border:0;background:var(--panel2);color:var(--fg);font-size:30px;font-weight:600}
  .vol button:active{background:#323743}
  .bar{flex:1;height:12px;border-radius:6px;background:var(--panel2);overflow:hidden}
  .bar i{display:block;height:100%;width:70%;background:var(--accent);transition:width .15s}
  .pct{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:4ch}
  .note{margin:12px max(24px,env(safe-area-inset-left)) 0;font-size:13px;color:var(--muted);line-height:1.5}

  /* Griglia stazioni */
  h2{margin:22px max(24px,env(safe-area-inset-left)) 12px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;
    padding:0 max(24px,env(safe-area-inset-right)) 24px max(24px,env(safe-area-inset-left));
  }
  .t{
    position:relative;min-height:156px;border-radius:20px;border:0;background:var(--panel);color:var(--fg);
    text-align:left;padding:16px;display:flex;flex-direction:column;gap:4px;
    transition:background .15s,transform .1s;
  }
  .t:active{transform:scale(.97)}
  .t .logo{
    flex:none;width:56px;height:56px;border-radius:14px;overflow:hidden;
    display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;
  }
  .t .logo img{display:block;width:100%;height:100%;object-fit:cover}
  .t .sp{flex:1;min-height:14px}
  .t b{font-size:21px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
  .t small{color:var(--muted);font-size:13px}
  .t.on{background:var(--accent);color:var(--accent-fg)}
  .t.on small{color:#4a4220}
  .t.on .logo{box-shadow:0 0 0 3px var(--accent-fg)}
  .t .badge{
    position:absolute;top:16px;right:14px;font-size:11px;font-weight:800;letter-spacing:.1em;
    background:var(--accent-fg);color:var(--accent);padding:5px 8px;border-radius:8px;
  }

  @media (max-width:600px){
    .now{flex-wrap:wrap;gap:14px 18px;padding-left:16px;padding-right:16px}
    #play{width:92px;height:92px}
    .vol{flex-basis:100%}
    h2{margin:18px 16px 10px}.note{margin:12px 16px 0}
    .grid{grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 16px}
    .t b{font-size:19px}
  }
</style>
</head>
<body>
<header class="now">
  <button id="play" aria-label="Ascolta la radio">
    <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
    <svg id="icoStop" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
    <span class="lbl" id="playLbl">Ascolta</span>
  </button>
  <div class="info">
    <div class="status"><span class="dot"></span><span id="statusText">Pronta</span></div>
    <div id="name"></div>
  </div>
  <div class="vol">
    <button id="down" aria-label="Volume giù">−</button>
    <div class="bar"><i id="fill"></i></div>
    <span class="pct" id="pct">70%</span>
    <button id="up" aria-label="Volume su">+</button>
  </div>
</header>
<p class="note" id="note" hidden></p>
<h2>Scegli la radio</h2>
<main class="grid" id="grid"></main>

<script>
// Elenco stazioni.
// url:  stream principale. Se manca o non funziona, l'app cerca da sola un
//       indirizzo aggiornato su radio-browser.info (archivio pubblico di stream radio).
// site: dominio da cui viene caricato il logo ufficiale (icona del sito).
// mono/color: sigla e colore usati se il logo non si carica.
const STATIONS = [
  { id:"rai1",    name:"Rai Radio 1",       genre:"Rai",             mono:"R1",  color:"#3b6fd8", site:"radio1.rai.it",           url:"https://icestreaming.rai.it/1.mp3", q:"Rai Radio 1" },
  { id:"rai2",    name:"Rai Radio 2",       genre:"Rai",             mono:"R2",  color:"#d9a400", site:"radio2.rai.it",           url:"https://icestreaming.rai.it/2.mp3", q:"Rai Radio 2" },
  { id:"rai3",    name:"Rai Radio 3",       genre:"Rai",             mono:"R3",  color:"#7a4fd0", site:"radio3.rai.it",           url:"https://icestreaming.rai.it/3.mp3", q:"Rai Radio 3" },
  { id:"rtl",     name:"RTL 102.5",         genre:"Hit",             mono:"RTL", color:"#c8323c", site:"rtl.it",                  url:"https://streamingv2.shoutcast.com/rtl-1025", q:"RTL 102.5" },
  { id:"deejay",  name:"Radio Deejay",      genre:"Musica",          mono:"DJ",  color:"#2f9e5b", site:"deejay.it", alt:["www.deejay.it","radiodeejay.it"], url:"https://streamcdnm3-4c4b867c89244861ac216426883d1ad0.msvdn.net/radiodeejay/radiodeejay/play1.m3u8", q:"Radio Deejay" },
  { id:"rds",     name:"RDS",               genre:"Musica",          mono:"RDS", color:"#d9572b", site:"rds.it",                  url:"https://icstream.rds.radio/rds", q:"RDS" },
  { id:"r105",    name:"Radio 105",         genre:"Musica",          mono:"105", color:"#c03a7a", site:"105.net",                 url:"https://icecast.unitedradio.it/Radio105.mp3", q:"Radio 105" },
  { id:"virgin",  name:"Virgin Radio",      genre:"Rock",            mono:"VR",  color:"#b8323a", site:"virginradio.it",          url:"https://icecast.unitedradio.it/Virgin.mp3", q:"Virgin Radio" },
  { id:"italia",  name:"Radio Italia",      genre:"Musica italiana", mono:"RI",  color:"#2f7fb8", site:"radioitalia.it",          url:"", q:"Radio Italia" },
  { id:"capital", name:"Radio Capital",     genre:"Classici",        mono:"CAP", color:"#5a6478", site:"capital.it", alt:["www.capital.it","radiocapital.it"], url:"https://streamcdnm11-4c4b867c89244861ac216426883d1ad0.msvdn.net/radiocapital/radiocapital/play1.m3u8", q:"Radio Capital" },
  { id:"kisskiss",name:"Radio Kiss Kiss",   genre:"Musica",          mono:"KK",  color:"#d63c8a", site:"radiokisskiss.it", alt:["www.radiokisskiss.it","kisskiss.it"], url:"", q:"Radio Kiss Kiss" },
  { id:"rmc",     name:"Radio Monte Carlo", genre:"Musica",          mono:"RMC", color:"#3a8f9c", site:"radiomontecarlo.net",     url:"https://icecast.unitedradio.it/RMC.mp3", q:"Radio Monte Carlo" },
  { id:"m2o",     name:"m2o",               genre:"Dance",           mono:"m2o", color:"#7b46c9", site:"m2o.it",                  url:"", q:"m2o" },
  { id:"radio24", name:"Radio 24",          genre:"Notizie",         mono:"24",  color:"#2d6a9f", site:"radio24.ilsole24ore.com", url:"", q:"Radio 24" },
  { id:"subasio", name:"Radio Subasio",     genre:"Musica",          mono:"SUB", color:"#4f8f3a", site:"radiosubasio.it",         url:"https://icecast.unitedradio.it/Subasio.mp3", q:"Radio Subasio" },
];

const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, v); } catch(e){} },
};

let vol = 0.7, playing = false, current = STATIONS[1];
let audio = null, ctx = null, gain = null, triedFallback = false, playToken = 0;
{ const v = parseFloat(store.get("r2vol")); if (v >= 0 && v <= 1) vol = v; }
{ const s = STATIONS.find(s => s.id === store.get("station")); if (s) current = s; }
// indirizzi trovati in precedenza tramite radio-browser
let found = {}; try { found = JSON.parse(store.get("found") || "{}") || {}; } catch(e){}

const iOS = /iP(ad|hone|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

// ---------- griglia ----------
// Fonti possibili per il logo ufficiale, provate in ordine finché una dà un'immagine nitida.
function logoCandidates(s){
  const doms = [s.site].concat(s.alt || []);
  const list = [];
  for (const d of doms) list.push("https://www.google.com/s2/favicons?sz=256&domain=" + encodeURIComponent(d));
  for (const d of doms) list.push("https://icon.horse/icon/" + encodeURIComponent(d));
  list.push("https://icons.duckduckgo.com/ip3/" + encodeURIComponent(s.site) + ".ico");
  return list;
}
// Ultima risorsa: il logo registrato per la stazione su radio-browser.info
async function radioBrowserLogo(s){
  try {
    const r = await fetch("https://all.api.radio-browser.info/json/stations/search?name=" + encodeURIComponent(s.q) + "&countrycode=IT&order=votes&reverse=true&limit=5");
    const list = await r.json();
    const hit = list.find(x => /^https:/.test(x.favicon || ""));
    return hit ? hit.favicon : null;
  } catch(e) { return null; }
}
function loadImg(url){
  return new Promise(res => {
    const img = new Image();
    img.alt = ""; img.referrerPolicy = "no-referrer";
    img.onload = () => res(img); img.onerror = () => res(null);
    img.src = url;
  });
}
async function loadLogo(s, box){
  let best = null;
  for (const url of logoCandidates(s)) {
    const img = await loadImg(url);
    if (!img) continue;
    if (img.naturalWidth >= 64) { best = img; break; }          // nitido: lo uso subito
    if (img.naturalWidth >= 32 && (!best || img.naturalWidth > best.naturalWidth)) best = img;
  }
  if (!best || best.naturalWidth < 64) {
    const u = await radioBrowserLogo(s);
    const img = u && await loadImg(u);
    if (img && img.naturalWidth >= 32 && (!best || img.naturalWidth > best.naturalWidth)) best = img;
  }
  if (best) { box.textContent = ""; box.style.background = "#fff"; box.appendChild(best); }
}
function buildGrid(){
  const g = $("grid");
  for (const s of STATIONS) {
    const b = document.createElement("button");
    b.className = "t"; b.dataset.id = s.id;
    b.innerHTML = `<span class="logo" style="background:${s.color}">${s.mono}</span>
      <span class="sp"></span><b>${s.name}</b><small>${s.genre}</small>`;
    loadLogo(s, b.querySelector(".logo"));
    b.onclick = () => choose(s);
    g.appendChild(b);
  }
}

// ---------- stato ----------
function status(t){ $("statusText").textContent = t; }
function render(){
  document.body.classList.toggle("playing", playing);
  $("icoPlay").toggleAttribute("hidden", playing);
  $("icoStop").toggleAttribute("hidden", !playing);
  $("playLbl").textContent = playing ? "Ferma" : "Ascolta";
  $("play").setAttribute("aria-label", (playing ? "Ferma " : "Ascolta ") + current.name);
  $("name").textContent = current.name;
  $("fill").style.width = Math.round(vol*100) + "%";
  $("pct").textContent = Math.round(vol*100) + "%";
  for (const b of document.querySelectorAll(".t")) {
    const on = b.dataset.id === current.id;
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", on);
    let badge = b.querySelector(".badge");
    if (on && !badge) { badge = document.createElement("span"); badge.className = "badge"; b.appendChild(badge); }
    if (!on && badge) badge.remove();
    if (badge) badge.textContent = playing ? "IN ONDA" : "SCELTA";
  }
  if ("mediaSession" in navigator && window.MediaMetadata) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: current.name, artist: "In diretta" });
  }
}

// ---------- volume ----------
function applyVol(){
  if (gain) gain.gain.value = vol;
  if (audio) audio.volume = gain ? 1 : vol;
  store.set("r2vol", vol);
  render();
}

// ---------- riproduzione ----------
function streamFor(s){ return found[s.id] || s.url; }
function remember(s, url){ found[s.id] = url; store.set("found", JSON.stringify(found)); }

// Verifica (con timeout) se lo stream consente CORS: solo allora il volume
// può essere regolato dall'app anche su iPad/iPhone (tramite Web Audio).
function corsAllowed(url){
  if (!window.fetch || !window.AbortController || /\.m3u8/.test(url)) return Promise.resolve(false);
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), 2500);
  return fetch(url, { mode:"cors", signal: ac.signal })
    .then(r => { ac.abort(); return r.ok; })
    .catch(() => false)
    .finally(() => clearTimeout(t));
}

// Cerca su radio-browser.info un indirizzo funzionante per la stazione.
async function lookup(s){
  const hosts = ["de1.api.radio-browser.info", "fi1.api.radio-browser.info", "all.api.radio-browser.info"];
  for (const h of hosts) {
    try {
      const r = await fetch(`https://${h}/json/stations/search?name=${encodeURIComponent(s.q)}&countrycode=IT&hidebroken=true&order=votes&reverse=true&limit=10`);
      if (!r.ok) continue;
      const list = await r.json();
      const ok = list.filter(x => /^https:/.test(x.url_resolved || "") && x.url_resolved !== streamFor(s));
      return ok.length ? ok[0].url_resolved : null;
    } catch(e) {}
  }
  return null;
}

function teardown(){
  if (!audio) return;
  audio.onerror = audio.onwaiting = audio.onplaying = null;
  audio.pause(); audio.removeAttribute("src"); audio.load();
  audio = null; gain = null;
}

async function play(){
  const token = ++playToken;
  teardown();
  playing = true; render(); status("Connessione…");
  let url = streamFor(current);
  if (!url) {
    url = await lookup(current);
    if (token !== playToken) return;
    if (!url) return fail();
    remember(current, url);
  }

  // elemento audio nuovo a ogni avvio: evita problemi passando da una radio all'altra
  const el = new Audio(); el.preload = "none"; el.setAttribute("playsinline", "");
  audio = el;
  if (iOS && await corsAllowed(url)) {
    if (token !== playToken) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = ctx || new AC();
      el.crossOrigin = "anonymous";
      const src = ctx.createMediaElementSource(el);
      gain = ctx.createGain();
      src.connect(gain).connect(ctx.destination);
    } catch(e) { gain = null; el.removeAttribute("crossorigin"); }
  }
  if (token !== playToken) return;
  if (ctx && ctx.state === "suspended") ctx.resume();
  el.onerror = () => onError(token);
  el.onwaiting = () => playing && status("Buffering…");
  el.onplaying = () => {
    status("In diretta"); triedFallback = false;
    const n = $("note");
    n.hidden = !(iOS && !gain);
    n.textContent = "Per questa radio il volume si regola con i tasti laterali del dispositivo.";
  };
  el.src = url + (url.includes("?") ? "&" : "?") + "t=" + Date.now();   // sempre in diretta
  applyVol();
  const p = el.play();
  if (p) p.catch(err => {
    if (token !== playToken || err.name === "AbortError") return;
    if (err.name === "NotAllowedError") { teardown(); playing = false; render(); status("Tocca Ascolta per avviare"); return; }
    onError(token);
  });
}

async function onError(token){
  if (token !== playToken || !playing) return;
  if (!triedFallback) {
    triedFallback = true;
    status("Cerco un altro collegamento…");
    const url = await lookup(current);
    if (token !== playToken) return;
    if (url) { remember(current, url); return play(); }
  }
  fail();
}
function fail(){
  teardown(); playing = false; triedFallback = false; render();
  status(current.name + " non è raggiungibile ora. Riprova più tardi.");
}

function stop(){
  playToken++; teardown(); playing = false; triedFallback = false;
  $("note").hidden = true;
  status("Fermata"); render();
}

function choose(s){
  const same = s.id === current.id;
  current = s; store.set("station", s.id); triedFallback = false;
  if (same && playing) { render(); return; }
  play();
}

// ---------- comandi ----------
$("play").onclick = () => playing ? stop() : play();
$("up").onclick = () => { vol = Math.min(1, Math.round((vol+0.1)*10)/10); applyVol(); };
$("down").onclick = () => { vol = Math.max(0, Math.round((vol-0.1)*10)/10); applyVol(); };
document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); $("play").click(); }
  if (e.key === "ArrowUp") { e.preventDefault(); $("up").click(); }
  if (e.key === "ArrowDown") { e.preventDefault(); $("down").click(); }
});

// Controlli dal centro di controllo / schermata di blocco (avanti/indietro = cambia radio)
if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play", play);
  navigator.mediaSession.setActionHandler("pause", stop);
  try { navigator.mediaSession.setActionHandler("stop", stop); } catch(e){}
  const step = d => () => { const i = STATIONS.indexOf(current); choose(STATIONS[(i + d + STATIONS.length) % STATIONS.length]); };
  try {
    navigator.mediaSession.setActionHandler("nexttrack", step(1));
    navigator.mediaSession.setActionHandler("previoustrack", step(-1));
  } catch(e){}
}

buildGrid();
render();
</script>
</body>
</html>
